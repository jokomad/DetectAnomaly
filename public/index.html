<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Volatility Signals</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0f1221;
            --panel: #151936;
            --muted: #8e96b3;
            --text: #e8ecff;
            --accent: #6ea8fe;
            --green: #48d597;
            --red: #ff6b6b;
            --warn: #f5c46b;
            --border: #232953;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", "Apple Color Emoji", "Segoe UI Emoji";
            padding: 20px;
            cursor: grab;
            user-select: none;
        }

        body.dragging {
            cursor: grabbing;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 5px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        .status-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            margin: 0 0 10px;
            font-size: 12px;
            color: var(--accent);
        }
        
        .subtitle {
            color: var(--muted);
            font-size: 7px;
        }
        
        .status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        
        .status-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .status-item {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        
        .signals {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .signal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        
        .signal-card.cooling-off {
            display: none;
        }
        
        .signal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent);
        }
        
        .signal-symbol {
            font-size: 32px;
            font-weight: 800;
            margin: 15px 0;
            letter-spacing: 0.5px;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 13px;
            color: var(--muted);
            margin-top: 15px;
            text-align: center;
        }
        
        .signal-details div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .signal-details b {
            color: var(--text);
            font-size: 15px;
        }

        .hot-now .signal-symbol {
            color: var(--red);
        }
        
        .rising .signal-symbol {
            color: var(--green);
        }
        
        .cooling-off .signal-symbol {
            color: var(--warn);
        }
        
        .no-data {
            color: var(--muted);
            font-style: italic;
        }
        
        .loading {
            text-align: center;
            color: var(--muted);
            padding: 40px;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .history {
            margin-top: 2px;
        }

        .history-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--accent);
            text-align: center;
        }

        .history-list {
            background: transparent;
            border: none;
            border-radius: 0;
            max-height: none;
            overflow-y: visible;
        }

        .history-item {
            padding: 18px 25px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            display: grid;
            grid-template-columns: 140px 1fr 1fr;
            gap: 20px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .history-item:last-child {
            border-bottom: 1px solid var(--border);
        }

        .history-item:nth-child(odd) {
            background: var(--panel);
        }

        .history-item:nth-child(even) {
            background: rgba(21, 25, 54, 0.7);
        }

        .history-time {
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .history-signal {
            font-weight: 600;
            font-size: 16px;
            padding: 0;  /* Remove padding from signal container */
            border-radius: 6px;
            text-align: center;
        }

        .history-signal.hot a,
        .history-signal.rising a {
            display: block;
            padding: 8px 12px;
            color: var(--text);
            text-decoration: none;
            width: 100%;
            height: 100%;
        }

        .history-signal.hot {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid var(--red);
        }

        .history-signal.rising {
            background: rgba(72, 213, 151, 0.2);
            border: 1px solid var(--green);
        }

        .history-signal.cooling {
            display: none;
        }

        .history-signal.none {
            color: var(--muted);
            font-style: italic;
            display: none;
        }

        .symbol-link {
            color: inherit;
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            display: inline-block;
        }

        .symbol-link:hover {
            background: rgba(255, 255, 255, 0.1);
            text-decoration: none;
        }

        .symbol-link.none {
            cursor: default;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                width: 100%;
            }

            .signals {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .signal-card {
                margin: 0;
                padding: 15px;
            }

            .status {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .status-row {
                flex-direction: row;
                width: 100%;
            }

            .status-item {
                flex: 1;
                min-width: 0;
                padding: 8px;
                font-size: 11px;
            }

            .signal-symbol {
                font-size: 28px;
                margin: 10px 0;
            }

            .signal-details {
                gap: 8px;
            }

            .history-item {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px 15px;
            }

            .history-time {
                grid-column: 1 / -1;
                text-align: center;
            }

            .history-signal {
                font-size: 14px;
                padding: 6px 8px;
            }
        }

        @media (max-width: 480px) {
            .history-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="status">
                <div class="status-row">
                    <div class="status-item">
                        Last Update: <strong id="lastUpdate">Loading...</strong>
                    </div>
                    <div class="status-item">
                        Next Scan: <strong id="nextScan">--</strong>
                    </div>
                </div>
            </div>
        </header>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div class="signals" style="display: none;">
            <div class="signal-card hot-now">
                <div class="signal-title">🔥 Hot Now</div>
                <div class="signal-symbol" id="hotSymbol">Loading...</div>
                <div class="signal-details" id="hotDetails">
                    <div>Current Avg: <b id="hotCurrent">--</b></div>
                    <div>Z-Score: <b id="hotZScore">--</b></div>
                    <div>Slope: <b id="hotSlope">--</b></div>
                </div>
            </div>

            <div class="signal-card rising">
                <div class="signal-title">📈 Rising</div>
                <div class="signal-symbol" id="risingSymbol">Loading...</div>
                <div class="signal-details" id="risingDetails">
                    <div>Ratio: <b id="risingRatio">--</b></div>
                    <div>Slope: <b id="risingSlope">--</b></div>
                    <div>Z-Score: <b id="risingZScore">--</b></div>
                </div>
            </div>

            <div class="signal-card cooling-off" style="display: none;"></div>
                <div class="signal-title">❄️ Cooling Off</div>
                <div class="signal-symbol" id="coolingSymbol">Loading...</div>
                <div class="signal-details" id="coolingDetails">
                    <div>Drop: <b id="coolingDrop">--</b></div>
                    <div>Prev Z-Score: <b id="coolingPrevZ">--</b></div>
                    <div>Slope: <b id="coolingSlope">--</b></div>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-list" id="historyList">
                <div style="padding: 40px; text-align: center; color: var(--muted);">
                    Loading history...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize WebSocket connection
        const socket = io();
        let scanHistory = [];

        // Cleanup function to prevent memory leaks
        function cleanup() {
            if (socket) {
                socket.disconnect();
            }
        }

        // Handle page unload
        window.addEventListener('beforeunload', cleanup);
        window.addEventListener('unload', cleanup);

        function updateNextScanCountdown() {
            const nextScanEl = document.getElementById('nextScan');
            const now = new Date();
            const currentSeconds = now.getSeconds();

            // Calculate seconds until next scan (at 3 seconds past the minute)
            let secondsUntilNext;
            if (currentSeconds <= 3) {
                secondsUntilNext = 3 - currentSeconds;
            } else {
                secondsUntilNext = 60 - currentSeconds + 3;
            }

            if (secondsUntilNext === 0) {
                nextScanEl.textContent = 'Now';
            } else {
                nextScanEl.textContent = `${secondsUntilNext}s`;
            }
        }
        
        function createSymbolLink(symbol, isNone = false) {
            if (isNone || symbol === 'none') {
                return `<span class="symbol-link none">${symbol}</span>`;
            }
            const goodCryptoUrl = `https://app.goodcrypto.app/trade/BBIT0/${symbol}`;
            return `<a href="${goodCryptoUrl}" target="_blank">${symbol}</a>`;
        }

        function formatTimeUTC2(timestamp) {
            const date = new Date(timestamp);
            // Convert to UTC+2 (add 2 hours)
            const utc2Date = new Date(date.getTime() + (2 * 60 * 60 * 1000));
            return utc2Date.toLocaleTimeString('en-US', {
                hour12: false,
                timeZone: 'UTC'
            });
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');

            if (scanHistory.length === 0) {
                historyList.innerHTML = '<div style="padding: 50px; text-align: center; color: var(--muted); font-size: 16px;">No scan results yet...</div>';
                return;
            }

            const historyHTML = scanHistory.map(result => {
                const time = formatTimeUTC2(result.timestamp);
                const hotSymbol = result.hotNow?.symbol || 'none';
                const risingSymbol = result.rising?.symbol || 'none';
                const coolingSymbol = result.coolingOff?.symbol || 'none';

                return `
                    <div class="history-item">
                        <div class="history-time">${time}</div>
                        <div class="history-signal ${result.hotNow ? 'hot' : 'none'}">${createSymbolLink(hotSymbol, !result.hotNow)}</div>
                        <div class="history-signal ${result.rising ? 'rising' : 'none'}">${createSymbolLink(risingSymbol, !result.rising)}</div>
                        <div class="history-signal ${result.coolingOff ? 'cooling' : 'none'}">${createSymbolLink(coolingSymbol, !result.coolingOff)}</div>
                    </div>
                `;
            }).join('');

            historyList.innerHTML = historyHTML;
        }
        
        function updateDisplay(data) {
            // Update status
            document.getElementById('lastUpdate').textContent =
                data.timestamp ? formatTimeUTC2(data.timestamp) : 'Never';
            document.getElementById('scanStatus').textContent =
                data.scanning ? 'Scanning...' : 'Ready';
            
            // Update Hot Now
            if (data.hotNow) {
                document.getElementById('hotSymbol').textContent = data.hotNow.symbol;
                document.getElementById('hotCurrent').textContent = `${data.hotNow.current.toFixed(3)}%`;
                document.getElementById('hotZScore').textContent = data.hotNow.zScore.toFixed(2);
                document.getElementById('hotSlope').textContent = data.hotNow.slope.toFixed(4);
            } else {
                document.getElementById('hotSymbol').textContent = 'No signal';
                document.getElementById('hotSymbol').className = 'signal-symbol no-data';
                document.getElementById('hotCurrent').textContent = '--';
                document.getElementById('hotZScore').textContent = '--';
                document.getElementById('hotSlope').textContent = '--';
            }
            
            // Update Rising
            if (data.rising) {
                document.getElementById('risingSymbol').textContent = data.rising.symbol;
                document.getElementById('risingRatio').textContent = `${data.rising.ratio.toFixed(2)}×`;
                document.getElementById('risingSlope').textContent = data.rising.slope.toFixed(4);
                document.getElementById('risingZScore').textContent = data.rising.zScore.toFixed(2);
            } else {
                document.getElementById('risingSymbol').textContent = 'No signal';
                document.getElementById('risingSymbol').className = 'signal-symbol no-data';
                document.getElementById('risingRatio').textContent = '--';
                document.getElementById('risingSlope').textContent = '--';
                document.getElementById('risingZScore').textContent = '--';
            }
            
            // Update Cooling Off
            if (data.coolingOff) {
                document.getElementById('coolingSymbol').textContent = data.coolingOff.symbol;
                document.getElementById('coolingDrop').textContent = `${data.coolingOff.drop.toFixed(3)}%`;
                document.getElementById('coolingPrevZ').textContent = data.coolingOff.prevZScore.toFixed(2);
                document.getElementById('coolingSlope').textContent = data.coolingOff.slope.toFixed(4);
            } else {
                document.getElementById('coolingSymbol').textContent = 'No signal';
                document.getElementById('coolingSymbol').className = 'signal-symbol no-data';
                document.getElementById('coolingDrop').textContent = '--';
                document.getElementById('coolingPrevZ').textContent = '--';
                document.getElementById('coolingSlope').textContent = '--';
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // WebSocket event listeners
        socket.on('connect', () => {
            hideError();
        });

        socket.on('disconnect', () => {
            showError('Connection lost. Attempting to reconnect...');
        });

        socket.on('currentResults', (data) => {
            updateDisplay(data);
        });

        socket.on('newScanResult', (data) => {
            updateDisplay(data);
        });

        socket.on('scanHistory', (history) => {
            scanHistory = history;
            renderHistory();
        });

        socket.on('connect_error', (error) => {
            showError('Failed to connect to server: ' + error.message);
        });

        // Mouse drag scrolling functionality
        let isDragging = false;
        let startY = 0;
        let startScrollTop = 0;

        document.addEventListener('mousedown', (e) => {
            // Only enable drag scrolling on left mouse button and not on links
            if (e.button === 0 && !e.target.closest('a')) {
                isDragging = true;
                startY = e.clientY;
                startScrollTop = window.pageYOffset;
                document.body.classList.add('dragging');
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaY = startY - e.clientY;
            const newScrollTop = startScrollTop + deltaY;
            window.scrollTo(0, newScrollTop);
            e.preventDefault();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                document.body.classList.remove('dragging');
            }
        });

        document.addEventListener('mouseleave', () => {
            if (isDragging) {
                isDragging = false;
                document.body.classList.remove('dragging');
            }
        });

        // Update countdown every second
        setInterval(updateNextScanCountdown, 1000);
    </script>
</body>
</html>
